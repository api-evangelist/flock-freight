aid: flock-freight
name: Flock Freight
description: 'Flock Freight is a freight technology company and licensed freight brokerage
  that pioneered shared truckload (STL) shipping through its FlockDirect service. Its
  AI-powered pooling technology algorithmically combines multiple partial shipments
  from different businesses into a single multi-stop full truckload, giving shippers
  truckload-level service, damage rates, and speed without paying for a full trailer,
  while cutting empty miles and carbon emissions. The platform provides automated
  spot rating via API, TMS integrations, and EDI connectivity (204/210/211/214/990/997)
  for shippers and carriers. Backed by GV and the SoftBank Vision Fund, the company
  is a certified B Corporation.'
